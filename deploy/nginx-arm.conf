server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/arm;
    index index.html;

    # The dev/ and deploy/ folders are never uploaded, but block them just in case.
    location ~ ^/(dev|deploy|apps-script)/ { return 404; }

    location / {
        try_files $uri $uri.html $uri/ =404;   # /mamou/dounet -> /mamou/dounet.html
    }

    location ~* \.(css|js|png|jpg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /config.js { expires -1; }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    gzip on;
    gzip_types text/css application/javascript;
}
